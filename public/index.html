<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f7fb">
  <title>Tomodachi Chat</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <div class="brand-mark" aria-hidden="true">✦</div>
      <p class="eyebrow">SIMPLE GROUP CHAT</p>
      <h1>Tomodachi <span>Chat</span></h1>
      <p class="sub">ルームナンバーで、気軽につながろう。</p>

      <div id="startView">
        <form id="joinForm">
          <label for="name">あなたの名前</label>
          <input id="name" maxlength="30" placeholder="例：さくら" autocomplete="nickname" required>
          <label for="roomNumber">ルームナンバー（6桁）</label>
          <input id="roomNumber" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="例：123456" aria-describedby="roomHint">
          <p class="hint" id="roomHint">参加する場合は、共有された番号を入力して「入室」。自分で作る場合は、好きな番号を入力して「この番号で作成」。空欄なら番号を自動で決めます。</p>
          <button id="joinBtn" class="primary" type="submit">入力した番号のルームに入室 <span>→</span></button>
        </form>
        <div class="or"><span>新しいルームを作成</span></div>
        <button id="createBtn" class="secondary full" type="button">＋ この番号で作成（空欄なら自動）</button>
        <p id="homeError" class="error" role="alert" hidden></p>
      </div>

      <div id="chatView" hidden>
        <div class="room-banner">
          <div><span class="room-label">ROOM NUMBER</span><strong id="roomNumberDisplay">000000</strong></div>
          <button id="copyBtn" class="secondary" type="button">番号をコピー</button>
        </div>
        <p class="hint">友だちにこの6桁の番号を伝えて、同じルームに参加してもらおう。</p>
        <section class="participants-panel" aria-label="参加者一覧">
          <div class="participants-heading"><strong>参加者</strong><span><b id="participantCount">—</b> 人が接続中</span></div>
          <div id="participantList" class="participant-list"><span class="participant-empty">接続待ち…</span></div>
        </section>
        <div class="savebar">
          <button id="saveBtn" type="button">トークを保存</button>
          <button id="clearBtn" type="button" class="light-button">保存を削除</button>
          <span>保存はこの端末のブラウザ内</span>
        </div>
        <div id="status" class="status">接続中...</div>
        <div id="messages" class="messages" aria-live="polite"></div>
        <form id="sendForm" class="send">
          <input id="text" autocomplete="off" maxlength="1000" placeholder="メッセージを入力..." required aria-label="メッセージ">
          <button type="submit" class="send-button" aria-label="送信">送信</button>
        </form>
        <button id="backBtn" class="back-button" type="button">← ルーム選択に戻る</button>
      </div>
    </section>
    <p class="page-note">PC・スマートフォン対応 · 気軽に話せるグループチャット</p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
